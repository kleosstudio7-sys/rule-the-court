<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Rule the Court</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2118;--tan:#d6c4a8;--bg:#e8f7f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2321}}
:root[data-theme="dark"]{--bg:#0f2321}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Londrina Solid',Impact,'Comic Sans MS',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}
[hidden]{display:none!important}
#g{position:fixed;inset:0;overflow:hidden;container-type:size;--u:min(1cqw,1.6cqh);background:#8d827a;user-select:none}
#sc{position:absolute;inset:0;width:100%;height:100%}
button{font-family:inherit;color:var(--ink);cursor:pointer;background:var(--tan);border:3px solid var(--ink);border-radius:10px;font-size:max(11px,calc(2.3*var(--u)));padding:.2em .6em}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.4}
input,select{font:inherit;border:3px solid var(--ink);border-radius:8px;padding:.1em .3em}
#bb{position:absolute;top:4%;left:36%;width:60%;background:var(--tan);border:4px solid var(--ink);border-radius:22px;padding:2% 3%}
#who{color:#e8761d;font-size:max(14px,calc(4*var(--u)));font-weight:900;line-height:1}
#tx{font-size:max(12px,calc(3.2*var(--u)));line-height:1.1;margin-top:.3em;font-weight:900}
#yn{position:absolute;left:24%;top:36%;display:flex;gap:6px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:50%/60%;padding:1% 3%}
#yn button{background:#4c4;font-weight:900;transform:rotate(-6deg)}#yn .n{background:#d33;transform:rotate(6deg)}#yn .x{background:#f4a62a;transform:none}
#st{position:absolute;left:2%;bottom:3%;background:var(--tan);border:4px solid var(--ink);border-radius:12px;padding:1% 2%;font-size:max(14px,calc(4.2*var(--u)));font-weight:900;line-height:1.15}
#st div{display:flex;align-items:center;gap:.4em}
.ic{width:1em;height:1em;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.b{background:#2f86d6}.gn{background:#5cc45a}.y{background:#f5c22b}
#si{font-size:max(9px,calc(1.8*var(--u)));font-weight:400}
#ct{position:absolute;right:2%;bottom:3%;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
#ts{position:absolute;right:2%;bottom:14%;max-width:50%;background:#fffd;border:3px solid var(--ink);border-radius:10px;padding:.3em .6em;font-size:max(11px,calc(2.4*var(--u)))}
#ts:empty{display:none}
#ck{position:absolute;left:0;top:0;height:1.2%;background:#f5c22b;border-bottom:3px solid var(--ink)}
#nt{position:absolute;inset:0;background:#0a0a3c;opacity:0;transition:opacity 1s;pointer-events:none}
#zz{position:absolute;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(8*var(--u))}
.pp{position:absolute;inset:4%;background:var(--tan);border:4px solid var(--ink);border-radius:14px;overflow:auto;padding:2%}
.tb{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.tb .on{background:#f5c22b}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:5px}.bd p{grid-column:1/3;margin:0}
.rw{display:flex;justify-content:space-between;text-align:left;gap:6px}
#tg{display:none}#g.tw #tg{display:inline}#g.tw #roomg{display:none}#g.tw #rl,#g.tw #vs{display:none}#tc{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;gap:10px}#tc button{font-size:max(16px,calc(4*var(--u)));touch-action:none}.q{cursor:pointer}.mk{animation:bob .7s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-8px)}}#yn #ig{background:#bbb;transform:none}.cl{animation:drift 60s linear infinite}@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
</style></head><body>
<div id="g">
<svg id="sc" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid slice">
<defs><pattern id="br" width="80" height="40" patternUnits="userSpaceOnUse"><rect width="80" height="40" fill="#9b8f86"/><path d="M0 0H80M0 20H80M0 40H80M40 0V20M0 20V40M80 20V40" stroke="#6b5f58" stroke-width="3" fill="none"/></pattern>
<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd8ec"/><stop offset="1" stop-color="#e4f3f0"/></linearGradient></defs>
<g id="roomg"><rect width="1000" height="625" fill="url(#br)"/>
<path d="M300 430V200Q300 90 520 90Q740 90 740 200V430Z" fill="url(#sk)"/>
<g stroke="#2b2118" stroke-width="4" stroke-linejoin="round">
<rect x="360" y="260" width="60" height="170" fill="#cfc8c0"/><polygon points="350,260 390,180 430,260" fill="#47a86a"/>
<rect x="470" y="220" width="80" height="210" fill="#d9d2ca"/><polygon points="458,220 510,120 562,220" fill="#3f9a62"/>
<rect x="610" y="270" width="64" height="160" fill="#cfc8c0"/><polygon points="600,270 642,190 684,270" fill="#47a86a"/>
<rect x="500" y="290" width="18" height="30" fill="#f5c22b"/><rect x="385" y="320" width="14" height="24" fill="#f5c22b"/><rect x="635" y="330" width="14" height="24" fill="#f5c22b"/></g>
<g id="hs"></g>
<path d="M300 430V200Q300 90 520 90Q740 90 740 200V430Z" fill="none" stroke="#2b2118" stroke-width="10"/>
<rect y="500" width="1000" height="125" fill="#5a3f2e"/><g id="gp"></g></g>
<g id="tg"><rect width="1000" height="625" fill="url(#sk)"/><g class="cl" fill="#fff" stroke="#2b2118" stroke-width="4"><ellipse cx="0" cy="90" rx="70" ry="26"/><ellipse cx="45" cy="75" rx="45" ry="24"/></g><g class="cl" style="animation-delay:-30s" fill="#fff" stroke="#2b2118" stroke-width="4"><ellipse cx="0" cy="170" rx="60" ry="22"/><ellipse cx="40" cy="156" rx="38" ry="20"/></g><rect y="430" width="1000" height="195" fill="#8a7a5c"/><path d="M0 500H1000" stroke="#2b2118" stroke-width="6"/><g id="th" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"></g><g id="np"></g><g id="pl"></g><g id="gd"></g></g>
<g id="rl" transform="translate(190,300) scale(1.3)"></g>
<g id="vs" transform="translate(830,420) scale(1.1)"></g>
<g id="gh" style="display:none" transform="translate(560,330)"><path d="M-40 60V-10Q-40 -60 0 -60Q40 -60 40 -10V60L25 45L10 60L-5 45L-20 60Z" fill="#fff" fill-opacity=".8" stroke="#2b2118" stroke-width="4"/><circle cx="-14" cy="-20" r="6" fill="#2b2118"/><circle cx="14" cy="-20" r="6" fill="#2b2118"/><ellipse cx="0" cy="5" rx="8" ry="11" fill="#2b2118"/></g>
<g id="bs" style="display:none"></g>
</svg>
<div id="nt"></div><div id="ck"></div>
<div id="bb" hidden><div id="who"></div><div id="tx"></div></div>
<div id="yn" hidden><button onclick="ch('y')">Y</button><b>/</b><button class="n" onclick="ch('n')">N</button><button class="x" id="ex" onclick="ch('x')"></button><button id="ig" onclick="ch('i')">Ignore</button></div>
<div id="st"><div><i class="ic b"></i><span id="sP"></span></div><div><i class="ic gn"></i><span id="sH"></span></div><div><i class="ic y"></i><span id="sG"></span></div><span id="si"></span></div>
<div id="ts"></div>
<div id="ct"><button onclick="B?say('Answer first!'):M()">Menu</button><button id="wk" onclick="walk()">Walk town</button><button id="sb" onclick="sleep()" title="Optional: sleep any time to skip to the next day">Sleep</button><button onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">⛶</button></div>
<div id="tc" hidden></div><div id="pn" class="pp" hidden></div><div id="md" class="pp" hidden></div><div id="zz" hidden>Zzz...</div>
</div>
<script>
const $=i=>document.getElementById(i),R=Math.random,F=Math.floor,cl=v=>Math.max(0,Math.min(100,Math.round(v)));
let S,B=null,AF=null,Q=[],slp=0,mo=0,rows=[],tab='Realm',lg=[],lt,hr=60;
const DEF=()=>({name:'Aria',king:0,skin:'#f2c9a0',hair:'#2a1a3a',robe:'#4a78c8',crown:'#f2c230',gold:10,people:2,happy:70,unrest:10,tax:15,troops:0,tl:0,walls:0,wx:0,guards:1,mach:0,farms:0,mines:0,pick:0,biz:0,land:1,houses:[],inf:0,chef:0,slaves:0,know:0,pens:1,env:null,ast:{},sling:0,wp:{t:0,b:0,f:0},dm:{h:0,f:0,w:0},shop:{on:0,pr:100,it:{bread:1,cloth:0,tools:0,swords:0}},grain:0,cm:0,hm:0,wt:0,pw:null,day:1,t:0,sl:0,loans:[],warn:-1,deaths:0,debtors:0,fear:0,made:0,ks:[{n:'Redmoor',p:40,rel:0},{n:'Goldvale',p:28,rel:10},{n:'Stonehelm',p:75,rel:-5},{n:'Bonereach',p:60,rel:0,skel:1}]});
const save=()=>{try{localStorage.setItem('realm1',JSON.stringify(S))}catch(e){}};
const G=d=>S.gold=Math.max(0,Math.round(S.gold+d)),H=d=>S.happy=cl(S.happy+d),U=d=>S.unrest=cl(S.unrest+d),P=d=>S.people=Math.max(0,Math.round(S.people+d));
const cap=()=>40+S.land*40+S.houses.length*6,pw=()=>Math.round(S.troops*(1+S.tl*.5)+S.walls*12+S.wx*10+S.guards*1.5+S.mach*22*(1+S.tl*.2)+S.sling*10);
let tn=0;const idle=()=>!B&&$('pn').hidden&&!mo&&!slp&&!tn;
function say(t){lg.push(t);lg=lg.slice(-3);$('ts').innerHTML=lg.join('<br>');clearTimeout(lt);lt=setTimeout(()=>{lg=[];$('ts').innerHTML=''},8000)}
function upd(){if(S.made&&S.people<=0)return die('Your kingdom emptied out.');$('sP').textContent=S.people;$('sH').textContent=S.happy+'%';$('sG').textContent=S.gold;$('si').textContent='Day '+S.day+' · power '+pw()+' · unrest '+S.unrest+'%';$('ck').style.width=Math.min(100,S.t/10.2)+'%';$('nt').style.opacity=(S.t>=900||slp)?.5:0;$('gh').style.display=S.sl>=2?'':'none';$('sb').disabled=0;save()}
function ruler(el,s){el.innerHTML=`<g stroke="#2b2118" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M-62 40Q-80 150 -70 230L70 230Q80 150 62 40Z" fill="${s.hair}"/><path d="M-55 120Q-70 230 -85 250L85 250Q70 230 55 120Q40 80 0 80Q-40 80 -55 120Z" fill="${s.robe}"/><path d="M-20 85L0 160L20 85Z" fill="#f4efe6"/><circle cx="0" cy="40" r="46" fill="${s.skin}"/><path d="M-48 36Q-30 -10 0 0Q30 -10 48 36Q20 14 0 22Q-20 14 -48 36Z" fill="${s.hair}"/>${s.king?'<path d="M-36 58Q0 120 36 58Q0 80 -36 58Z" fill="'+s.hair+'"/>':''}<path d="M-40 -2L-44 -50L-22 -26L0 -62L22 -26L44 -50L40 -2Z" fill="${s.crown}"/></g><circle cx="-16" cy="42" r="5" fill="#2b2118"/><circle cx="16" cy="42" r="5" fill="#2b2118"/><path d="M-9 60Q0 66 9 60" stroke="#2b2118" stroke-width="4" fill="none"/>`}
function vis(c,h){$('vs').innerHTML=`<g stroke="#2b2118" stroke-width="5" stroke-linejoin="round"><path d="M-50 90Q-60 20 0 20Q60 20 50 90L70 120L-70 120Z" fill="${c}"/><circle cx="0" cy="0" r="34" fill="#efe8f0"/>${h?'<path d="M-36 -8L0 -52L36 -8Z" fill="'+c+'"/>':'<path d="M-34 -10Q0 -40 34 -10Q0 -22 -34 -10Z" fill="#2b2118"/>'}</g><circle cx="-11" cy="2" r="4" fill="#2b2118"/><circle cx="11" cy="2" r="4" fill="#2b2118"/><path d="M-8 16L-4 26L0 16L4 26L8 16" stroke="#2b2118" stroke-width="3" fill="#fff"/>`}
function drawH(){$('hs').innerHTML=S.houses.slice(-14).map((h,i)=>`<g stroke="#2b2118" stroke-width="3"><rect x="${315+i*29}" y="400" width="24" height="30" fill="${h.c}"/><polygon points="${311+i*29},400 ${327+i*29},382 ${343+i*29},400" fill="#8a3b2a"/></g>`).join('');const base=['#e07a5f','#81b29a','#f2cc8f','#6a8caf','#c08497','#b5a642'],cu=S.houses.slice(-6).map(h=>h.c);$('th').innerHTML=base.map((c,i)=>`<rect x="${30+i*160}" y="300" width="130" height="190" fill="${cu[i]||c}"/><polygon points="${20+i*160},300 ${95+i*160},210 ${170+i*160},300" fill="#8a3b2a"/><rect x="${80+i*160}" y="410" width="30" height="80" fill="#5a3f2e"/>`).join('')}
(()=>{let a=[];for(let i=0;i<260;i++){const x=R()*1000;a.push([x,625-R()*(120+170*Math.max(0,1-Math.abs(x-230)/330))])}a.sort((p,q)=>p[1]-q[1]);$('gp').innerHTML='<g stroke="#2b2118" stroke-width="3" fill="#f5c22b">'+a.map(p=>`<ellipse cx="${p[0]|0}" cy="${p[1]|0}" rx="30" ry="15"/>`).join('')+'</g>'})();

function ask(w,c,t,y,n,x,xl){B={y,n,x};vis(c,F(R()*2));$('who').textContent=w;$('tx').textContent=t;$('bb').hidden=0;$('yn').hidden=0;$('vs').style.display='';$('ex').hidden=!x;$('ex').textContent=xl||'⚔ Execute';$('pn').hidden=1}
function pump(d){setTimeout(()=>{if(idle()&&Q.length)Q.shift()()},d)}
function ch(k){if(!B)return;const f=k=='i'?()=>H(-1):B[k];B=null;$('bb').hidden=1;$('yn').hidden=1;$('vs').style.display='none';f&&f();upd();if(!B){const a=AF;AF=null;if(a)a();if(!B&&Q.length)pump(15000)}}
function kill(f){H(f?-3:-12);U(f?3:18);P(-1);say(f?'Justice served.':'Killed for no reason... the people whisper.');scn(exSvg(f));if(f){S.fear=Math.min(.3,S.fear+.02)}else{H(-3);P(-1);if(R()<.3)Q.push(()=>{atk('kin',.25,'The victims family cornered and stabbed you!')})}}
function die(m){S.deaths++;mo=0;$('bs').style.display='none';B=null;Q=[];AF=null;$('bb').hidden=1;$('yn').hidden=1;$('vs').style.display='none';$('g').classList.remove('tw');tn=0;clearInterval(tid);$('tc').hidden=1;$('wk').textContent='Walk town';S.gold=Math.round(S.gold*.4)+100;S.people=Math.max(10,Math.round(S.people*.8));S.troops=Math.round(S.troops*.5);S.guards=Math.round(S.guards*.5);S.t=0;S.sl=0;S.unrest=25;S.warn=-1;slp=0;$('zz').hidden=1;say('💀 '+m+' You respawn at the throne.');upd()}

const ksp=k=>Math.max(1,Math.round((k.p*(1+(k.up||0)*.3)+(k.m||0)*15)*(k.skel?1.2:1)-(k.skel?S.wx*8:0)));
const wpw=m=>{const w=S.wp,t=w.t+w.b+w.f;if(!S.walls||!t)return 0;return Math.min(1,S.troops/t)*(m=='a'?w.t*(1.6+S.walls*.1)+w.b*1.2+w.f:w.t*.8+w.b*1.8+w.f*.4)};
const SI={crops:[9,0],bread:[6,2],cloth:[10,5],tools:[14,7],swords:[20,10]};
function shopInc(){if(!S.shop.on)return 0;let t=0;const pr=S.shop.pr/100,d=Math.max(0,1.7-pr);for(const k in SI)if(S.shop.it[k]){const[b,c]=SI[k];if(k=='crops'){const u=Math.min(S.grain,Math.round(S.people*.12*d));S.grain-=u;t+=u*b*pr;continue}t+=S.people*.12*d*(b*pr-c)}if(pr>1.3)H(-1);if(pr<.8)H(1);return Math.round(t)}
function shopUI(){mo=1;$('pn').hidden=1;$('md').hidden=0;const s=S.shop;$('md').innerHTML='<h2 style="margin:0">Your shop</h2><div style="display:grid;gap:6px;max-width:340px">Price level <input type="range" id="sp" min="50" max="200" step="5" value="'+s.pr+'"><b id="spv">'+s.pr+'%</b>'+Object.keys(SI).map(k=>'<label><input type="checkbox" id="si_'+k+'" '+(s.it[k]?'checked':'')+'> '+k+' (base '+SI[k][0]+'g, cost '+SI[k][1]+'g)</label>').join('')+'<small>High prices sell less and anger people; low prices please them but cut profit.</small><button onclick="shopOk()">Save</button></div>';$('sp').oninput=()=>$('spv').textContent=$('sp').value+'%'}
function shopOk(){S.shop.pr=+$('sp').value;for(const k in SI)S.shop.it[k]=$('si_'+k).checked?1:0;hx();say('Shop updated.')}
function sellS(n,k){S.slaves-=n;if(!k){G(n*30);H(-3);U(3);say('Sold '+n+' slaves to townspeople. Some are uneasy.')}else if(R()<.5+k.rel/200){G(n*55);k.rel+=3;H(-1);U(1);say(k.n+' bought '+n+' slaves for '+n*55+'g.')}else{S.slaves+=n;k.rel-=2;say(k.n+' refused to buy slaves.')}}
function sendE(k,t){S.env={k:S.ks.indexOf(k),t,d:S.day+1};say('You send someone to '+k.n+' to strike a deal. He returns tomorrow.')}
function deal(k,t,p){if(t=='c')S.grain=0;else{if(S.slaves<3)return say('You no longer have 3 slaves.');S.slaves-=3;H(-1);U(1)}G(p);k.rel+=3;say('Deal done with '+k.n+': +'+p+'g.')}
function envBack(){const e=S.env;S.env=null;const k=S.ks[e.k];if(!k||k.dead||k.enemy||R()>.6+k.rel/200){if(k)k.rel-=2;return say('Your envoy was turned away'+(k?' by '+k.n:'')+'.')}const p=e.t=='c'?Math.round(S.grain*9*(k.ally?1.3:1)):165;Q.push(()=>ask('Envoy','#b83',k.n+' offers '+p+'g for '+(e.t=='c'?S.grain+' crops':'3 slaves')+'. Accept (Y) or haggle (N)?',()=>deal(k,e.t,p),()=>{if(R()<.5)deal(k,e.t,Math.round(p*1.4));else{k.rel-=3;say('The deal collapsed.')}}))}
function ctrade(k){if(!k.enemy&&R()<.65+k.rel/200){const g=Math.round(S.grain*9*(k.ally?1.3:1));G(g);S.grain=0;k.rel+=2;say(k.n+' bought your crops for '+g+'g.')}else{k.rel-=2;say(k.n+' refused your crops.')}}
function steal(k){const g=Math.round(ksp(k)*.8+20);if(R()<.45){G(g);k.rel-=3;say('🤫 Stole '+g+'g from '+k.n+'!')}else{k.rel-=35;k.enemy=1;k.ally=0;G(-30);if(S.warn<0)S.warn=S.ks.indexOf(k);say('Caught! '+k.n+' is furious and may attack.')}}
function stealP(){const g=Math.round(10+S.people*.9);G(g);H(-3);U(3);if(R()<.35){H(-8);U(10);say('You were seen! The people riot with anger.')}else say('You took '+g+'g from your people. Hopefully unseen.')}
function dmg(s){const n=Math.max(1,Math.round(s*2));for(let i=0;i<n;i++){const t=F(R()*3);if(t==0&&S.houses.length){S.houses.pop();S.dm.h++}else if(t==1&&S.farms>0){S.farms--;S.dm.f++}else if(S.walls>0){S.walls--;S.dm.w++}}P(-Math.round(S.people*.05*s));drawH();say('🏚 Ruins! Pay to rebuild in Realm.')}
function rebuild(){const d=S.dm;for(let i=0;i<d.h;i++)S.houses.push({n:'Rebuilt home',k:'home',c:'#c9a27a'});S.farms+=d.f;S.walls+=d.w;S.dm={h:0,f:0,w:0};drawH();H(3);say('🔨 Everything rebuilt!')}
function atk(src,b,m){const p=b*(1-Math.min(.7,S.guards*.05))*(S.hm?.5:1)*(src=='food'&&S.chef?.3:1);if(R()<p){die(m);return 1}say(S.guards&&R()<.5?'🛡 Your guards stopped an assassin!':S.hm?'🗡 Your hitman spotted a plot!':'You survived an attempt on your life!');return 0}
function kgrow(k){const r=R();if(r<.5)k.p=Math.round(k.p+2+R()*3);else if(r<.7&&(k.up||0)<5){k.up=(k.up||0)+1;if(S.inf)say('Informant: '+k.n+' upgraded its troops (lvl '+k.up+')!')}else if(r<.85&&(k.m||0)<6){k.m=(k.m||0)+1;if(S.inf)say('Informant: '+k.n+' built '+(k.skel?'a bone catapult':'a siege machine')+'!')}else k.p++}
function kwar(a,b){if(a==b)return;const i=S.ks.indexOf(a),j=S.ks.indexOf(b);Q.push(()=>ask('Messenger','#58a',a.n+' and '+b.n+' are at war! Back '+a.n+' (Y) or '+b.n+' (N)? You send 25% of your troops. Ignore to stay out.',()=>side(i,j),()=>side(j,i)))}

const KT=['Weapons','Slingshots','Catapults','Wall fire & spikes','Wall upgrades','Elite troops'],KN=['','Weapons unlocked: troop upgrades!','Slingshots unlocked!','Catapults unlocked!','Wall fire & spikes unlocked!','Wall upgrades (level 4+) unlocked!','Elite troops (level 4+) unlocked!'],AS=[['tax','Tax collector (+10% income)'],['doc','Physician (halves plague deaths)'],['cap','Guard captain (calms unrest)'],['tutor','Tutor (cheaper books)']];
const rR=()=>{const d=S.dm,rc=d.h*50+d.f*60+d.w*90;return [['Custom house / shop',150,mkHouse],['Crop field (sells daily)',80,()=>{S.farms++}],['Hire miner',300,()=>{S.mines++}],['Upgrade pickaxes (lvl '+S.pick+')',250+S.pick*150,()=>{S.pick++}],['Expand kingdom',300,expand],['Invest in a townsperson business',120,invest],['Library: study '+(KT[S.know]||'(all read)')+' ('+S.know+'/6)',Math.round((100+S.know*60)*(S.ast.tutor?.7:1)),()=>{S.know++;say(KN[S.know])},S.know>=6],['Rebuild ruins ('+d.h+' homes, '+d.f+' fields, '+d.w+' walls)',rc,rebuild,!rc]]};

const rS=()=>[['Hire informant (news & spy)',80,()=>{S.inf=1},S.inf],[S.slaves>=2?'Slaves cook for you (free)':'Hire personal chef',S.slaves>=2?0:40,()=>{S.chef=1},S.chef],['Keep a hitman on retainer (cuts assassin odds)',150,()=>{S.hm=1},S.hm]].concat(AS.map(a=>[a[1]+(S.slaves>=2?' - slaves do it free':' (90g, 6g/day)'),S.slaves>=2?0:90,()=>{S.ast[a[0]]=1},S.ast[a[0]]]),[['Security: '+S.guards+'/'+S.land*3+' guards needed for your land',0,()=>0,1]]);
const rT=()=>[[S.shop.on?'Manage your shop (prices & items)':'Open your own shop',S.shop.on?0:100,()=>{S.shop.on=1;shopUI()}],['Crops: '+(S.cm?'STOCKING (not selling)':'selling daily')+' - switch',0,()=>{S.cm=1-S.cm}],['Sell stored crops ('+S.grain+')',0,()=>{G(S.grain*6);say('Sold '+S.grain+' crops.');S.grain=0},!S.grain]].concat(S.ks.flatMap(k=>k.dead?[]:[['Send a merchant to '+k.n+' to sell crops (20g)',20,()=>sendE(k,'c'),!S.grain||k.enemy||k.skel||S.env]]));
const rD=()=>S.ks.flatMap(k=>k.dead?[]:[[k.n+(k.ally?' (ally)':'')+': ask to ally',0,()=>ally(k),k.ally||k.skel],[k.n+': trade for gold',0,()=>trade(k),k.enemy||k.skel],[k.n+': declare war (power '+ksp(k)+')',0,()=>war(k)],[k.n+': hitman (weakens them)',150,()=>hit(k)],[k.n+': steal (risky)',0,()=>steal(k),k.skel]].concat(k.ally?[[k.n+': BETRAY (conquer or steal)',0,()=>betray(k)]]:[]));
const rSl=()=>[['Buy 3 slaves',60,()=>{S.slaves+=3;U(2)}],['Build slave pen (+8 slots)',80,()=>{S.pens++}],['Sell 3 slaves to townspeople (+90g, people uneasy)',0,()=>sellS(3,0),S.slaves<3]].concat(S.ks.flatMap(k=>k.dead?[]:[['Send envoy to '+k.n+' to sell 3 slaves (20g)',20,()=>sendE(k,'s'),S.slaves<3||k.enemy||k.skel||S.env]]),[['Execute ALL slaves (unrest +15, happiness -10)',0,()=>{S.slaves=0;U(15);H(-10)},!S.slaves]]);

const IN={Slaves:()=>{const c=S.pens*8;return '<b>Slaves: '+S.slaves+'</b> | Pens: '+S.slaves+'/'+c+' slots'+(S.slaves>c?' <b>(OVERCROWDED: unrest rises and slaves die)</b>':'')+'<br>They earn '+S.slaves*6+'g a day. '+(S.slaves>=2?'Slaves cook and do assistant jobs for FREE.':'With 2+ slaves, your chef and assistants cost nothing.')+'<br>Selling angers people a little. Kingdoms pay more but may refuse. Each land expansion adds a pen.'},Allies:()=>'<small>Everyone starts neutral. <b>Ask to ally</b> (they may refuse), <b>trade</b> for quick gold, <b>declare war</b>, <b>hitman</b> (weakens them, may fail), <b>steal</b> (risky).</small>'+S.ks.filter(k=>!k.dead).map(k=>'<br><b>'+k.n+'</b>'+(k.skel?' (skeletons)':'')+': '+(k.ally?'ALLY':k.enemy?'ENEMY':'not allied')+' | mood: '+mood(k)+' | power '+ksp(k)+' (troops '+k.p+', lvl '+(k.up||0)+', '+(k.m||0)+' machines)'+(k.skel?' | never allies or trades':'')).join('')};

const rY=()=>[['Customize ruler',0,creator],['Start a NEW game (erases save)',0,newGame],['Burn a house/business',0,()=>{if(S.houses.length)S.dm.h++;S.houses.pop();drawH();P(-3);U(8);H(-6);say('You burned it down.')}],['Execute someone (no reason)',0,()=>kill(0)],['Steal from your own people',0,stealP],['Execute EVERYONE',0,()=>{P(-S.people*.3);U(35);H(-25);say('The people are terrified...')}],['Forgive all debts',0,()=>{S.debtors=0;H(8);U(-6)}],['Publicly execute debtors',0,()=>{S.debtors=0;U(10);H(-5);S.fear=Math.min(.3,S.fear+.1);say('Fewer will dare to default.');scn(exSvg(1))},!S.debtors]];

function invest(){if(R()<.7){S.biz++;say('They agreed! New daily income.')}else ask('Merchant','#a74','I refuse your coin! Forgive (Y) or kill (N)?',()=>H(2),()=>kill(1))}
function expand(){S.land++;S.pens++;say('Kingdom expanded. +1 slave pen, and you now need '+S.land*3+' guards for security.');const a=S.ks.filter(k=>!k.dead);if(S.land>=3&&R()<.5){const k=a[F(R()*a.length)];if(k.skel){say('Rattling bones at the border: '+k.n+' does not talk.');S.warn=S.ks.indexOf(k);return}ask(k.n+' envoy','#58a','Your border touches our land! Negotiate (Y) or fight (N)?',()=>{if(R()<.55+k.rel/200){k.rel+=5;say('Border agreed peacefully.')}else ask(k.n,'#a33','Talks failed. Retreat (Y) or go to war (N)?',()=>{S.land--;say('You retreated, avoiding conflict.')},()=>war(k))},()=>war(k))}}
function ally(k){if(R()<.55+k.rel/200){k.ally=1;k.rel+=15;say(k.n+' accepts! You grow together.')}else{k.rel-=10;say(k.n+' refuses.')}}
function trade(k){if(R()<.75){G((S.farms*35+40)*(k.ally?1.5:1));say('Trade succeeded!')}else say(k.n+' refused to trade.')}
function hit(k){if(k.skel){G(150);say('The hitman: You cannot kill the dead. Refunded.');return}if(R()<.55){k.p=Math.round(k.p*.6);say('The hitman struck! '+k.n+' is shaken.')}else{k.enemy=1;k.rel-=40;say('The hitman failed and talked...')}}
function betray(k){ask('Betrayal','#222','Conquer '+k.n+' (Y) or secretly steal from them (N)?',()=>{k.ally=0;war(k,1,1)},()=>{if(R()<.35){k.enemy=1;k.ally=0;k.rel=-60;say('Caught stealing! They hate you now.')}else{G(100+k.p);say('Stolen secretly!')}})}
function war(k,f=1,all){S.wt=3;scn(arm(k),3600);const m=pw()*f,e=ksp(k)*(.8+R()*.5);if(R()<m/(m+e)){const n=Math.round(k.p*.5+5);if(R()<.8){G(k.p*4);say('Victory over '+k.n+'! +'+k.p*4+'g')}else say('Victory, but no loot.');k.p=Math.round(k.p*.5);k.ally=0;k.enemy=1;k.rel=-60;if(all){k.dead=1;say(k.n+' is now part of your kingdom!')}S.troops=Math.round(S.troops*.9);if(k.skel){k.p=Math.round(k.p*1.3);say('The bones reassemble... the skeletons rise again!')}else Q.push(()=>ask('Spoils','#a63','Take '+n+' captives as citizens (Y) or slaves (N)?',()=>P(n),()=>{S.slaves+=n;U(3)}))}else{S.troops=Math.round(S.troops*.6);P(-S.people*.1);G(-S.gold*.2);k.enemy=1;k.rel=-60;k.ally=0;say('Defeat vs '+k.n+'! Troops, people & gold lost.');dmg(1)}}
function battle(k){const m=pw()+wpw('a'),e=ksp(k)*(.8+R()*.5);say('⚔ '+k.n+' attacks!'+(k.skel?' Skeletons climb the walls in the dark!':''));scn(arm(k),3600);if(R()<m/(m+e)){const fr=S.wp.f/Math.max(1,S.troops);S.troops=Math.round(S.troops*(.88-Math.min(.1,fr*.2)));k.rel-=5;if(k.skel){k.p=Math.round(k.p*1.15);say('They reassemble...')}say('You held the line!')}else{S.troops=Math.round(S.troops*.6);P(-S.people*.12);G(-S.gold*.25);U(8);H(-8);say('You lost people and gold.');dmg(.8)}}
function civil(pp){const r=Math.round(S.people*S.unrest/200)+5,m=S.troops*(1+S.tl*.5)+S.guards*2+S.walls*6+wpw('r')+(pp||0);say('⚔ REBELLION! '+r+' rebels rise.');if(R()<m/(m+r)){S.troops=Math.round(S.troops*.85);U(-30);say('You crushed it.');dmg(.4)}else{G(-S.gold*.5);P(-S.people*.2);S.troops=Math.round(S.troops*.5);U(-20);say('Rebels won. Your kingdom is weak.');dmg(1.2)}}
let pd=0;function prep(){const r=Math.round(S.people*S.unrest/200)+5,c=r*6;pd=0;ask('Captain','#678','Rebels are rising ('+r+')! Pay '+c+'g to stack extra guards and troops? They may still win.',()=>{pd=1;if(S.gold<c){say('Not enough gold! Only a few came.');civil(5)}else{G(-c);say('Extra guards fill the halls.');civil(r*.8+10)}},()=>{pd=1;civil()});AF=()=>{if(!pd){pd=1;civil()}}}
function disaster(){const t=F(R()*10);if(t==0){const d=Math.round(S.people*(S.ast.doc?.06:.12));P(-d);say('☠ Plague! '+d+' died.')}else if(t==1){G(-90);if(S.farms>0){S.farms--;S.dm.f++}say('🌊 Flood! Repairs cost 90g and a field is ruined.')}else if(t==2){if(S.houses.length)S.dm.h++;S.houses.pop();drawH();G(-100);H(-5);say('🔥 Great fire! Rebuilding cost 100g.')}else if(t==3){say('🌋 Earthquake! Walls and homes cracked.');dmg(1.2)}else if(t==4){if(S.farms>0){S.farms--;S.dm.f++}H(-3);G(-40);say('☀ Drought! A field withered.')}else if(t==5){if(S.farms>0){S.farms--;S.dm.f++}S.grain=0;H(-2);say('🦗 Locusts ate a field and your stored crops!')}else if(t==6){say('🌪 Tornado tore through town!');dmg(.8)}else if(t==7){P(-Math.round(S.people*.06));H(-6);say('🥶 Blizzard famine! People starved.')}else if(t==8){G(-60);U(5);S.mines=Math.max(0,S.mines-1);P(-2);say('⛏ Mine collapse! A mine was lost.')}else{say('☄ Meteor strike!');dmg(1)}}

function dawn(){if(S.sl>=3)return die('You never slept and collapsed.');if(tn){tn=0;clearInterval(tid);$('g').classList.remove('tw');$('tc').hidden=1;$('wk').textContent='Walk town'}S.day++;S.t=0;const al=S.ks.filter(k=>!k.dead);
if(S.warn>=0){const k=S.ks[S.warn];S.warn=-1;if(!k.dead)Q.push(()=>battle(k))}
const inc=Math.round((S.people*S.tax*.08+(S.cm?0:S.farms*30)+S.mines*(12+S.pick*14)+S.biz*28+S.houses.filter(h=>h.k=='shop').length*18+S.slaves*6+shopInc())*(S.ast.tax?1.1:1)),ex=Math.round(S.troops*.6+S.guards*3+S.inf*8+(S.chef&&!S.slaves?5:0)+S.walls*3+Object.values(S.ast).filter(Boolean).length*(S.slaves>=2?0:6));G(inc-ex);say('Day '+S.day+': +'+inc+'g income, −'+ex+'g wages');
H(S.tax>25?-(S.tax-25)/2:(S.tax<10?3:1));U((S.tax>25?(S.tax-25)/2:-3)-S.guards*.3-(S.ast.cap?1.5:0)+(S.happy<40?4:-1));
const ov=Math.max(0,S.slaves-S.pens*8);if(ov){U(ov*.5);H(-1);if(R()<.3){S.slaves--;say('Crowded pens: a slave died.')}}
const nd=S.land*3;if(S.guards<nd){U((nd-S.guards)*.3);if(R()<.15){G(-30);say('🗝 Thieves hit your poorly guarded land! -30g')}}
if(S.cm)S.grain=Math.round((S.grain+S.farms*5)*.95);
const rn=S.dm.h+S.dm.f+S.dm.w;if(rn){H(-rn*.5);U(rn*.5)}
if(S.wt>0)S.wt--;
if(S.env&&S.env.d<=S.day)envBack();
if(S.pw&&S.pw.d<=S.day){const w=S.pw,a=S.ks[w.s],b=S.ks[w.o],ea=ksp(a)+w.n*1.5*(1+S.tl*.5),eb=ksp(b);S.pw=null;let win;if(R()<ea/(ea+eb)){win=a;S.troops+=Math.round(w.n*.8);const g=60+ksp(b);G(g);a.rel+=15;b.rel-=10;say('✅ '+a.n+' won! You are rewarded '+g+'g and your troops return.')}else{win=b;H(-3);G(-S.gold*.1);a.rel-=15;b.enemy=1;b.rel=Math.min(b.rel,-30);say('❌ '+a.n+' lost! '+b.n+' punishes you for taking the wrong side.')}const lo=win==a?b:a;win.p=Math.round(win.p*.75);lo.p=Math.round(lo.p*.5);if(S.inf)Q.push(()=>ask('Informant','#8a5',win.n+' won but is weakened. Attack the winner (Y)?',()=>war(win),()=>0,()=>{war(win,.55);war(lo,.55)},'Attack both!'))}
al.forEach(k=>{if(k.enemy&&R()<.04)Q.push(()=>atk('rival',.3,k.n+"'s assassin reached you!"))});
if(S.unrest>60&&R()<.06)Q.push(()=>atk('rebel',.3,'Rebels stormed your chambers!'));
if(S.inf){if(S.unrest>40)say('Informant: rebels are building up ('+S.unrest+'% unrest)!');if(R()<.25)Q.push(()=>ask('Informant','#8a5','A thief is robbing your people. Pay 30g to catch him (Y)?',()=>{G(-30);U(-2);H(1);say('Thief caught!')},()=>{H(-3);G(-15);say('The thief got away.')}))}
S.loans=S.loans.filter(l=>{if(l.d>S.day)return 1;if(R()<.65+S.fear){G(l.a);say('A loan was repaid.')}else{S.debtors++;say('A borrower defaulted!')}return 0});
if(S.happy>40&&S.people<cap()&&R()<.6){const n=Math.max(1,Math.min(cap()-S.people,Math.ceil(S.people*.1)+S.houses.length));Q.push(()=>ask('Settlers','#8a6','Because your kingdom is growing, '+n+' people want to join. Let them in?',()=>{P(n);say(n+' newcomers settled in.')},()=>say('You turned them away.')))}
if(S.unrest>55&&R()<S.unrest/150)Q.unshift(prep);if(R()<.07)disaster();
al.forEach(kgrow);
if(al.length>1&&S.day>1){const pk=()=>al[F(R()*al.length)];
if(R()<.3){const k=pk();if(!k.skel)Q.push(()=>ask(k.n+' envoy','#58a','Will you send 3 troops to help us in our war?',()=>{S.troops=Math.max(0,S.troops-3);k.rel+=12;say('They are grateful.')},()=>{k.rel-=8;if(k.ally&&R()<.5){k.ally=0;say('Your alliance is shaken!')}}))}
if(R()<.2){const k=pk();if(!k.ally&&!k.skel&&!k.enemy)Q.push(()=>ask(k.n,'#4a8','Will you ally with us, Your Majesty?',()=>{k.ally=1;k.rel+=20;say('Allied with '+k.n)},()=>{k.rel-=3}))}
if(R()<.15){const k=pk();if(!k.enemy)Q.push(()=>ask(k.n+' trader','#b83','Trade goods with us?',()=>{if(R()<.8){G(60+S.farms*20);say('Profitable trade!')}else{G(-40);say('They cheated you!')}},()=>0))}
if(R()<.12&&!S.pw)kwar(pk(),pk());}
al.forEach(k=>{if(S.warn<0&&!k.ally&&R()<(k.enemy?(k.skel?.12:.1):k.rel<-20?.05:.01)*(S.wt>0?2.5:1)){S.warn=S.ks.indexOf(k);if(S.inf)say('Informant: '+k.n+' plans to attack tomorrow!')}});
upd();pump(4000)}
function sleep(){if(tn)return say('Return to the castle first.');if(B||mo)return say('Finish first.');slp=1;$('zz').hidden=0;$('pn').hidden=1;setTimeout(()=>{slp=0;$('zz').hidden=1;if(R()<.06*(1-Math.min(.9,S.guards*.1)))return die('An assassin found you in your sleep!');S.sl=0;dawn();say('☀ You wake up. Checkpoint saved.')},5000)}
function tick(){if(!S.made||slp||mo)return;S.t++;if(S.t==900)say('🌙 Night falls. Sleep, or stay awake...');if(S.t>=1020){S.sl++;if(S.sl==2)say('👻 You are seeing ghosts...');dawn();return}if(S.t<900&&S.t%60==0&&idle()){if(Q.length)Q.shift()();else{const A=R()<.5?EV:TQ;A[F(R()*A.length)]()}}if(S.sl>=2&&S.t%30==0)say('👻 Boo... go to sleep.');upd()}
